contradictions:
- id: ct_lmst_revenue
  topic: FY2026 revenue
  type: NUMERIC_DISCREPANCY
  a_claim: Revenue close to $890 million (press)
  a_evidence: ev_lmst_press_rev
  b_claim: Revenue {{li_fy2026_revenue}} (audited 20-F)
  b_evidence: ev_lmst_20f_fy26_p62_revenue_fy2026
  note: The press figure appears to be gross corridor revenue before partner rebates.
- id: ct_lmst_leverage
  topic: Leverage and covenants
  type: NARRATIVE_VS_METRIC
  a_claim: 'CEO: leverage is comfortable, well within covenants (Q4 FY2026 call)'
  a_evidence: ev_lmst_call_leverage
  b_claim: Interest cover fell to {{met_interest_cover_fy2026}} while gross debt grew {{met_gross_debt_yoy_fy2026}}
  b_evidence: ev_lmst_covenant
prose:
  insights:
  - id: in_lmst_debt
    title: Growth is being bought with borrowed money
    classification: fact
    polarity: negative
    body: Gross debt grew {{met_gross_debt_yoy_fy2026}} to {{li_fy2026_gross_debt}} while revenue grew {{met_rev_yoy_fy2026}}. Interest cover
      is {{met_interest_cover_fy2026}}, so operating profit no longer covers interest.
    metrics:
    - met_gross_debt_yoy_fy2026
    - met_rev_yoy_fy2026
    - met_interest_cover_fy2026
    items:
    - li_fy2026_gross_debt
    red_flags:
    - RF_04_DEBT_OUTGROWING_REV
    - RF_05_WEAK_INTEREST_COVERAGE
  - id: in_lmst_receivables
    title: Settlement receivables are ballooning
    classification: fact
    polarity: negative
    body: DSO rose from {{met_dso_fy2024}} to {{met_dso_fy2026}} and receivables grew {{met_receivables_yoy_fy2026}}. Operating cash flow fell
      {{met_cfo_yoy_fy2026}} to {{li_fy2026_cfo}}.
    metrics:
    - met_dso_fy2024
    - met_dso_fy2026
    - met_receivables_yoy_fy2026
    - met_cfo_yoy_fy2026
    items:
    - li_fy2026_cfo
    red_flags:
    - RF_01_RECEIVABLES_STRETCH
    - RF_06_PROFIT_CASH_DIVERGENCE
  - id: in_lmst_liquidity
    title: Liquidity is thin heading into a covenant test
    classification: inference
    polarity: negative
    body: Free cash flow was {{met_fcf_fy2026}} and the current ratio is {{met_current_ratio_fy2026}}. With a quarterly interest-cover covenant,
      refinancing risk is the key watch item.
    metrics:
    - met_fcf_fy2026
    - met_current_ratio_fy2026
    red_flags:
    - RF_03_NEGATIVE_FCF
    - RF_07_LIQUIDITY_SQUEEZE
    news:
    - nw_lmst_loan
  - id: in_lmst_customers
    title: Customers feel the settlement strain
    classification: inference
    polarity: negative
    body: Payout-delay complaints on the Indonesia and Philippines corridors line up with the rise in settlement receivables. Only corroborated
      posts are counted.
    metrics:
    - met_dso_fy2026
    news:
    - nw_lmst_dompet
    sentiment:
    - p_lmst_payout
    - p_lmst_play
  - id: in_lmst_governance
    title: Two finance-function changes in one year
    classification: hypothesis
    polarity: negative
    body: The CFO changed in February and the auditor declined re-appointment in July. Filings give no reason for either, and the short-seller
      claim is not supported by any filing.
    news:
    - nw_lmst_cfo
    - nw_lmst_auditor
    - nw_lmst_short
  summary:
    verdict_headline: 'Fast growth on borrowed money: cash and governance under strain'
    verdict_prose: Revenue grew {{met_rev_yoy_fy2026}} to {{li_fy2026_revenue}}, but gross debt grew {{met_gross_debt_yoy_fy2026}} and free cash
      flow was {{met_fcf_fy2026}}. A CFO change and an auditor exit add governance risk.
    business_overview: Cross-border remittance corridors, a consumer wallet and merchant FX across Singapore, Malaysia, Indonesia and the Philippines.
    revenue_mix_summary: 'FY2026 segment revenue: cross-border remittance {{li_fy2026_segment_revenue_cross_border_remittance}}, wallet and payments
      {{li_fy2026_segment_revenue_wallet_and_payments}}, merchant FX {{li_fy2026_segment_revenue_merchant_fx}}.'
    management_summary: Tan Wei Ling is Group CEO; Arjun Mehta became CFO in February 2026; Siti Rahman is COO.
    governance_watch_note: The CFO changed in February and the predecessor auditor declined re-appointment in July, with no reason stated for
      either.
    opportunities:
    - MAS licence and Philippine payout network widen the corridor moat
    - Wallet cross-sell to remittance users
    - Merchant FX attaches to the corridor base
    risks:
    - Interest cover below one with a quarterly covenant test
    - Settlement receivables growing far faster than revenue
    - 'Governance: CFO change and auditor exit within a year'
    quarterly_direction_note: Q4 FY2026 revenue grew {{met_q_rev_yoy_q4fy2026}} YoY, but EBITDA margin slipped to {{met_q_ebitda_margin_q4fy2026}}
      from {{met_q_ebitda_margin_q4fy2025}}.
    analyst_follow_up_notes:
    - Request the covenant compliance certificate for the last test date
    - Ask the predecessor auditor's reasons via the Audit Committee
    - Reconcile settlement receivables by corridor partner
  market_advantages:
  - Revenue growth of {{peer_lmst_rev_growth_pct}} against a peer median of {{peer_median_rev_growth_pct}}
  - Licensed in Singapore with a wide Southeast Asian payout network
  market_disadvantages:
  - ROE of {{peer_lmst_roe_pct}} against a peer median of {{peer_median_roe_pct}}
  - Sendwell runs at an EBITDA margin of {{peer_sndw_ebitda_margin_pct}}
  market_positioning_prose: Lumen Straits grew {{peer_lmst_rev_growth_pct}} against a peer median of {{peer_median_rev_growth_pct}}, but its ROE
    of {{peer_lmst_roe_pct}} trails the median of {{peer_median_roe_pct}}.
stated_gaps:
- Covenant test results are not disclosed in this sample
- Lease liabilities are excluded from gross debt
