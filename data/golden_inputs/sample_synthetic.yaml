contradictions:
- id: ct_fy26_revenue
  topic: FY26 consolidated revenue
  type: NUMERIC_DISCREPANCY
  a_claim: Revenue ₹3,900 cr (press)
  a_evidence: ev_press_revenue
  b_claim: Revenue {{li_fy26_revenue}} (audited filing)
  b_evidence: ev_nexora_ar_fy26_p112_revenue_fy26
  note: The press figure appears to include other income.
- id: ct_collections
  topic: Working capital and collections
  type: NARRATIVE_VS_METRIC
  a_claim: 'Management: collections are normalising (Q4 FY26 call)'
  a_evidence: ev_call_collections
  b_claim: DSO rose to {{met_dso_fy26}} from {{met_dso_fy24}}
  b_evidence: ev_nexora_ar_fy26_p114_trade_receivables_fy26
prose:
  insights:
  - id: in_credit_growth
    title: Growth is financed by customers' credit, not cash
    classification: fact
    polarity: negative
    body: Revenue grew {{met_rev_yoy_fy26}} while receivables grew {{met_receivables_yoy_fy26}}. DSO moved from {{met_dso_fy24}} to {{met_dso_fy26}}
      and CFO/PAT fell to {{met_cfo_to_pat_fy26}}. Revenue is being booked faster than it is collected.
    metrics:
    - met_rev_yoy_fy26
    - met_receivables_yoy_fy26
    - met_dso_fy24
    - met_dso_fy26
    - met_cfo_to_pat_fy26
    red_flags:
    - RF_01_RECEIVABLES_STRETCH
    - RF_02_LOW_CASH_CONVERSION
  - id: in_sentiment_echo
    title: Merchant sentiment echoes the cash signal
    classification: inference
    polarity: negative
    body: Settlement complaints and the September outage line up with the stretch in receivables. Customer posts are only counted where news or
      filings corroborate them.
    metrics:
    - met_dso_fy26
    news:
    - nw_outage
    sentiment:
    - p_reddit_payouts
    - p_play_rating
  - id: in_leverage
    title: Leverage looks safe only because of the QIP
    classification: inference
    polarity: neutral
    body: Gross debt grew {{met_gross_debt_yoy_fy26}} and net debt stands at {{met_net_debt_to_ebitda_fy26}} EBITDA. Interest cover slipped to
      {{met_interest_cover_fy26}}, and the equity raise rather than operating cash funds the balance sheet.
    metrics:
    - met_gross_debt_yoy_fy26
    - met_net_debt_to_ebitda_fy26
    - met_interest_cover_fy26
    news:
    - nw_qip
    red_flags:
    - RF_04_DEBT_OUTGROWING_REV
  - id: in_cfo_timing
    title: CFO exit three months before the QIP
    classification: hypothesis
    polarity: negative
    body: The CFO resigned without a stated reason shortly before the capital raise. Filings do not link the two events.
    news:
    - nw_cfo_exit
    - nw_qip
  summary:
    verdict_headline: Growth is real, cash quality is deteriorating
    verdict_prose: Revenue grew {{met_rev_yoy_fy26}} to {{li_fy26_revenue}}, but operating cash flow moved {{met_cfo_yoy_fy26}} while receivables
      rose {{met_receivables_yoy_fy26}}. Merchant sentiment and a CFO exit point the same way.
    business_overview: Payment gateway, in-store POS and soundbox devices, merchant lending (Zeplo) and banking APIs for merchants in India.
    revenue_mix_summary: 'FY26 segment revenue: payment gateway {{li_fy26_segment_revenue_payment_gateway}}, in-store POS and devices {{li_fy26_segment_revenue_in_store_pos_and_devices}},
      merchant lending {{li_fy26_segment_revenue_merchant_lending}}, banking APIs {{li_fy26_segment_revenue_banking_apis}}.'
    management_summary: Anita Verghese is Managing Director and CEO; Sandeep Kulkarni became CFO in April 2026; Rahul Menon is CTO.
    governance_watch_note: The previous CFO left in March with no stated reason, three months before the QIP.
    opportunities:
    - Final RBI authorisation removes the licence overhang
    - Lending cross-sell to the existing merchant base
    - QIP proceeds fund capex and expansion
    risks:
    - Receivables stretching faster than revenue
    - Cash conversion below the institutional threshold for two years running
    - 'Compliance and reliability: KYC penalty and settlement outage'
    quarterly_direction_note: Q1 FY27 revenue grew {{met_q_rev_yoy_q1fy27}} YoY with EBITDA margin at {{met_q_ebitda_margin_q1fy27}}, down from
      {{met_q_ebitda_margin_q1fy26}} a year earlier.
    analyst_follow_up_notes:
    - 'Next check: Q2 FY27 receivables'
    - Ask management for the split of receivables between enterprise and bank partners
    - Reduce weight on broker targets until cash conversion recovers
  market_advantages:
  - Broad licence set after final RBI authorisation
  - In-house lending stack on a large merchant base
  - Return on equity of {{peer_nxra_roe_pct}} is above the peer median of {{peer_median_roe_pct}}
  market_disadvantages:
  - Revenue growth of {{peer_nxra_rev_growth_pct}} trails Paynest at {{peer_paynest_rev_growth_pct}}
  - Margin below Bharat Settle at {{peer_bsettle_ebitda_margin_pct}}
  market_positioning_prose: Nexora grew {{peer_nxra_rev_growth_pct}} against a peer median of {{peer_median_rev_growth_pct}}, with ROE of {{peer_nxra_roe_pct}}
    versus {{peer_median_roe_pct}} for the peer set.
stated_gaps:
- Lease liabilities are excluded from gross debt
