contradictions:
- id: ct_mrdn_revenue
  topic: FY2025 revenue
  type: NUMERIC_DISCREPANCY
  a_claim: Revenue above $1.1 billion (press)
  a_evidence: ev_mrdn_press_rev
  b_claim: Revenue {{li_fy2025_revenue}} (audited 10-K)
  b_evidence: ev_mrdn_10k_fy25_p62_revenue_fy2025
  note: The press figure appears to add interest income earned on customer funds.
- id: ct_mrdn_margin
  topic: Margin trajectory
  type: NARRATIVE_VS_METRIC
  a_claim: 'CFO: operating margin will keep expanding (Q2 FY2026 call)'
  a_evidence: ev_mrdn_call_margin
  b_claim: EBITDA margin moved from {{met_ebitda_margin_fy2024}} to {{met_ebitda_margin_fy2025}}
  b_evidence: ev_mrdn_10k_fy25_p62_operating_income_fy2025
prose:
  insights:
  - id: in_mrdn_cash
    title: Cash generation runs well ahead of reported profit
    classification: fact
    polarity: positive
    body: Operating cash flow was {{li_fy2025_cfo}} against net income of {{li_fy2025_pat}}, a CFO/PAT ratio of {{met_cfo_to_pat_fy2025}}. Free
      cash flow reached {{met_fcf_fy2025}}, a margin of {{met_fcf_margin_fy2025}}.
    metrics:
    - met_cfo_to_pat_fy2025
    - met_fcf_fy2025
    - met_fcf_margin_fy2025
    items:
    - li_fy2025_cfo
    - li_fy2025_pat
  - id: in_mrdn_collections
    title: Collections are getting faster as the business scales
    classification: fact
    polarity: positive
    body: DSO improved from {{met_dso_fy2023}} to {{met_dso_fy2025}} while revenue grew {{met_rev_yoy_fy2025}}. Receivables grew {{met_receivables_yoy_fy2025}},
      slower than sales.
    metrics:
    - met_dso_fy2023
    - met_dso_fy2025
    - met_rev_yoy_fy2025
    - met_receivables_yoy_fy2025
  - id: in_mrdn_balance
    title: Net cash balance sheet with fixed-rate convertible debt
    classification: fact
    polarity: positive
    body: Cash of {{li_fy2025_cash_and_equivalents}} exceeds gross debt of {{li_fy2025_gross_debt}}, and interest cover is {{met_interest_cover_fy2025}}.
      The current ratio is {{met_current_ratio_fy2025}}.
    metrics:
    - met_interest_cover_fy2025
    - met_current_ratio_fy2025
    items:
    - li_fy2025_cash_and_equivalents
    - li_fy2025_gross_debt
  - id: in_mrdn_sbc
    title: Stock-based pay flatters cash conversion
    classification: hypothesis
    polarity: negative
    body: The 10-K calls stock-based compensation a significant add-back, but the replay does not record the amount. Part of the cash-over-profit
      gap may be dilution rather than efficiency.
    sentiment:
    - p_mrdn_sbc
  - id: in_mrdn_regulatory
    title: Rewards-marketing questions are unconfirmed
    classification: hypothesis
    polarity: negative
    body: A single press report mentions regulator questions about card rewards marketing. No filing confirms an inquiry, so it stays a watch
      item.
    news:
    - nw_ftc
  summary:
    verdict_headline: 'High-quality compounder: profit is backed by cash'
    verdict_prose: Revenue grew {{met_rev_yoy_fy2025}} to {{li_fy2025_revenue}} with operating cash flow of {{li_fy2025_cfo}}, well above net
      income. No forensic rule fired, and the balance sheet holds net cash.
    business_overview: Accounts-payable automation, corporate cards, treasury and FX tools for mid-market businesses in the United States and
      Canada.
    revenue_mix_summary: 'FY2025 segment revenue: AP automation {{li_fy2025_segment_revenue_ap_automation}}, corporate cards {{li_fy2025_segment_revenue_corporate_cards}},
      treasury and FX {{li_fy2025_segment_revenue_treasury_and_fx}}, platform and other {{li_fy2025_segment_revenue_platform_and_other}}.'
    management_summary: Dana Whitfield is CEO, Marcus Oyelaran is CFO and Priya Raman is CTO; the team has been unchanged for four years.
    governance_watch_note: null
    opportunities:
    - Card interchange scales with customer spend
    - Autopay Agent deepens AP workflow lock-in
    - Buyback funded from free cash flow
    risks:
    - Stock-based compensation dilutes the cash story
    - Unconfirmed regulator questions on rewards marketing
    - Convertible notes due 2028 need refinancing or settlement
    quarterly_direction_note: Q2 FY2026 revenue grew {{met_q_rev_yoy_q2fy2026}} YoY with EBITDA margin at {{met_q_ebitda_margin_q2fy2026}}, up
      from {{met_q_ebitda_margin_q2fy2025}} a year earlier.
    analyst_follow_up_notes:
    - Ask for the stock-based compensation trend as a share of revenue
    - Confirm whether any regulator inquiry exists
    - Check the settlement plan for the 2028 convertible notes
  market_advantages:
  - ROE of {{peer_mrdn_roe_pct}} against a peer median of {{peer_median_roe_pct}}
  - Revenue growth of {{peer_mrdn_rev_growth_pct}} leads the profitable peers
  market_disadvantages:
  - Coinstrand grows {{peer_cstr_rev_growth_pct}}, faster but loss-making
  - Smaller card book than Brightspend
  market_positioning_prose: Meridian grew {{peer_mrdn_rev_growth_pct}} against a peer median of {{peer_median_rev_growth_pct}}, with ROE of {{peer_mrdn_roe_pct}}
    versus {{peer_median_roe_pct}}.
stated_gaps:
- Stock-based compensation amount is not recorded in this sample
- Lease liabilities are excluded from gross debt
